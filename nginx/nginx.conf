events {}

http {
    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Healthcheck
        location = /health {
            proxy_pass http://iptv-backend:8000/health;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            proxy_pass http://iptv-backend:8000/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Compatibilidade para apps que, por erro, montam:
        # /m3u/TOKEN/stalker_portal/server/load.php
        location ~ ^/m3u/[^/]+/stalker_portal/server/load\.php$ {
            proxy_pass http://iptv-backend:8000/stalker_portal/server/load.php$is_args$args;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Compatibilidade para apps que, por erro, montam:
        # /m3u/TOKEN/stalker_portal/portal.php
        location ~ ^/m3u/[^/]+/stalker_portal/portal\.php$ {
            proxy_pass http://iptv-backend:8000/stalker_portal/server/load.php$is_args$args;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # M3U playlist links
        location /m3u/ {
            proxy_pass http://iptv-backend:8000/m3u/;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # EPG XML links
        location /epg/ {
            proxy_pass http://iptv-backend:8000/epg/;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Compatibilidade principal: /server/load.php
        location = /server/load.php {
            proxy_pass http://iptv-backend:8000/stalker_portal/server/load.php;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Compatibilidade: /portal.php
        location = /portal.php {
            proxy_pass http://iptv-backend:8000/stalker_portal/server/load.php;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Compatibilidade: /stalker_portal/portal.php
        location = /stalker_portal/portal.php {
            proxy_pass http://iptv-backend:8000/stalker_portal/server/load.php;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Stalker/MAG portal
        location /stalker_portal/ {
            proxy_pass http://iptv-backend:8000/stalker_portal/;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Compatibilidade com apps que usam /c/
        location /c/ {
            proxy_pass http://iptv-backend:8000/c/;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-User-Agent $http_x_user_agent;
        }

        # Setup público do cliente
        location /setup/ {
            proxy_pass http://iptv-frontend:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs
        location = /docs {
            proxy_pass http://iptv-backend:8000/docs;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            proxy_pass http://iptv-backend:8000/redoc;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            proxy_pass http://iptv-backend:8000/openapi.json;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend React
        location / {
            proxy_pass http://iptv-frontend:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
